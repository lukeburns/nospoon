<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Standalone v86 FreeBSD demo with mesh TCP bridge; static build, assets from nospoon /v86/."/>
  <title>v86 + mesh bridge — nospoon example</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="page-header">
    <h1>v86</h1>
  </header>

  <section class="v86-section">
    <div id="v86-screen-container"></div>
    <p class="v86-toolbar">
      <span id="v86-bridge-status" class="bridge-status bridge-status--off" title="Bridge status"></span>
      <button type="button" id="v86-stop-ssh" class="bridge-disconnect-btn" hidden>Disconnect</button>
      <span class="toolbar-spacer"></span>
      <button type="button" id="v86-save-snapshot">Save</button>
      <button type="button" id="v86-clear-snapshot">Wipe</button>
    </p>
    <p id="v86-snapshot-status" class="v86-snapshot-status"></p>
    <span class="section-label">Log</span>
    <pre id="v86-log" class="v86-log" aria-label="Log"></pre>
  </section>

  <script>
  (function(){
    var CP='http://10.254.0.1',q=[],t=null,lastLen=0;
    function flush(){
      if(!q.length)return;var b=q.splice(0,50);
      try{var x=new XMLHttpRequest();x.open('POST',CP+'/api/browser-log',true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify(b))}catch(_){}
    }
    function push(s){q.push(s);if(!t)t=setTimeout(function(){t=null;flush()},100)}
    var origLog=console.log.bind(console),origErr=console.error.bind(console);
    console.log=function(){var a=[].slice.call(arguments).map(String).join(' ');push('[console.log] '+a);origLog.apply(console,arguments)};
    console.error=function(){var a=[].slice.call(arguments).map(String).join(' ');push('[console.err] '+a);origErr.apply(console,arguments)};
    window.addEventListener('error',function(e){push('[uncaught] '+e.message)});
    window.addEventListener('DOMContentLoaded',function(){
      var el=document.getElementById('v86-log');
      if(!el){push('v86-log element not found');return}
      var obs=new MutationObserver(function(){
        var txt=el.textContent||'';
        if(txt.length>lastLen){
          var newLines=txt.substring(lastLen).split('\n').filter(Boolean);
          newLines.forEach(function(l){push(l)});
          lastLen=txt.length;
        }
      });
      obs.observe(el,{childList:true,characterData:true,subtree:true});
      push('remote-console attached');
    });
    setInterval(function(){
      try{
        var x=new XMLHttpRequest();x.open('GET',CP+'/api/browser-cmd',false);x.send();
        if(x.status===200){
          var cmds=JSON.parse(x.responseText);
          cmds.forEach(function(cmd){
            var em=window.__v86;
            if(!em){push('[cmd] no emulator');return}
            if(cmd.type==='keyboard'){em.keyboard_send_text(cmd.text);push('[cmd] sent: '+cmd.text.replace(/\n/g,'\\n'))}
          });
        }
      }catch(_){}
    },1000);
  })();
  </script>
  <script src="bundle.js" defer></script>
</body>
</html>
